<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <!-- Lingkaran Hijau Tua & Border Emas -->
  <circle cx="80" cy="80" r="74" fill="#073C24" stroke="#EAB308" stroke-width="4" />
  <circle cx="80" cy="80" r="68" stroke="#CA8A04" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Bintang Emas Puncak -->
  <polygon points="80,24 83,32 91,32 85,37 87,45 80,40 73,45 75,37 69,32 77,32" fill="#EAB308" />

  <!-- Siluet Padi Kiri & Kanan (Emas & Putih) -->
  <g fill="#EAB308">
    <!-- Tangkai Kiri -->
    <path d="M52 48 Q 44 70 54 94 Q 62 108 80 114" stroke="#EAB308" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <ellipse cx="46" cy="54" rx="4.5" ry="2.5" transform="rotate(-30 46 54)" />
    <ellipse cx="43" cy="64" rx="4.5" ry="2.5" transform="rotate(-15 43 64)" />
    <ellipse cx="43" cy="74" rx="4.5" ry="2.5" transform="rotate(5 43 74)" />
    <ellipse cx="46" cy="84" rx="4.5" ry="2.5" transform="rotate(25 46 84)" />
    <ellipse cx="52" cy="94" rx="4.5" ry="2.5" transform="rotate(40 52 94)" />
    <ellipse cx="62" cy="104" rx="4.5" ry="2.5" transform="rotate(55 62 104)" />

    <!-- Tangkai Kanan -->
    <path d="M108 48 Q 116 70 106 94 Q 98 108 80 114" stroke="#EAB308" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <ellipse cx="114" cy="54" rx="4.5" ry="2.5" transform="rotate(30 114 54)" />
    <ellipse cx="117" cy="64" rx="4.5" ry="2.5" transform="rotate(15 117 64)" />
    <ellipse cx="117" cy="74" rx="4.5" ry="2.5" transform="rotate(-5 117 74)" />
    <ellipse cx="114" cy="84" rx="4.5" ry="2.5" transform="rotate(-25 114 84)" />
    <ellipse cx="108" cy="94" rx="4.5" ry="2.5" transform="rotate(-40 108 94)" />
    <ellipse cx="98" cy="104" rx="4.5" ry="2.5" transform="rotate(-55 98 104)" />
  </g>

  <!-- Simbol Rumah / Gapura Joglo di Tengah -->
  <path d="M80 54 L62 70 L98 70 Z" fill="#FEF9C3" />
  <rect x="66" y="70" width="28" height="20" fill="#FEF9C3" />
  <path d="M74 90 L74 76 Q80 72 86 76 L86 90 Z" fill="#073C24" />

  <!-- Pita Kuning di Bawah Lingkaran -->
  <path d="M46 118 Q 80 126 114 118 L 110 128 Q 80 136 50 128 Z" fill="#EAB308" />
  <text x="80" y="125.5" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="bold" fill="#073C24" letter-spacing="0.5">DESA BOLALI</text>
</svg>
